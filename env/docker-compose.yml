version: '3.8'
services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: texinsite-pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: texinsite_secret
      POSTGRES_DB: texinsite_db
    ports:
      - "5432:5432"
    volumes:
      - pgvector-data:/var/lib/postgresql/data

volumes:
  pgvector-data: